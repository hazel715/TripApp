name: Refactory checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tripapp
          POSTGRES_PASSWORD: tripapp
          POSTGRES_DB: tripapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tripapp -d tripapp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tripapp:tripapp@localhost:5432/tripapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
